# Quality Gates
quality_gates:
  pre_publish:
    - "constitution_check_passed"
    - "identity_law_passed"
    - "evidence_coverage_100%"
    - "preview_verified"
    - "human_approval_confirmed"
    - "version_number_assigned"
  
  pre_rollback:
    - "version_exists"
    - "human_approval_confirmed"
    - "audit_trail_recorded"

# Learning & Transfer
learning:
  min_confidence: 0.7
  auto_promote_threshold: 0.9
  validation_required: true
  transfer_to_all_agents: true

# Audit Requirements
audit:
  evidence_url_required: true
  evidence_url_format: "https://{domain}/{path}#section"
  max_findings_without_evidence: 0
  hallucination_tolerance: 0